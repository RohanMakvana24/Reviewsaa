name: Foundation checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      AUTH_TEST_DATABASE_URL: mysql://reviesnest:local-dev-only@127.0.0.1:13307/reviesnest_auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Prepare isolated auth test database
        run: |
          npm run infra:up
          docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysql -u root' <<'SQL'
          CREATE DATABASE IF NOT EXISTS reviesnest_auth_test;
          GRANT ALL ON reviesnest_auth_test.* TO 'reviesnest'@'%';
          SQL
          DATABASE_URL="$AUTH_TEST_DATABASE_URL" npm run db:deploy
      - run: npm test
      - run: npm run build
